<style>
/* Layout: sticky mode bar + lecture filter chips; cards read like labelled frames (lecture code = header field) */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --sunk:#E3E9E7; --ink:#10231F; --muted:#51625D; --line:#CBD6D2;
  --accent:#0E6BA8; --accent-ink:#FFFFFF; --accent-soft:#DCEBF6;
  --trap:#9A4A06; --trap-soft:#FBEBD8; --ok:#15803D; --ok-soft:#DDF3E4; --bad:#B42318; --bad-soft:#FBE3E0;
  --star:#C2860A;
  --f-display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,"Segoe UI",sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1716; --surface:#16211F; --sunk:#1D2A27; --ink:#E4ECE9; --muted:#9AAEA8; --line:#2C3B38;
  --accent:#5BB0E8; --accent-ink:#06202F; --accent-soft:#16344A;
  --trap:#F0A55A; --trap-soft:#3A2712; --ok:#5FD08A; --ok-soft:#133523; --bad:#FF8A7A; --bad-soft:#3D1814; --star:#F2C14E;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#16211F; --sunk:#1D2A27; --ink:#E4ECE9; --muted:#9AAEA8; --line:#2C3B38;
  --accent:#5BB0E8; --accent-ink:#06202F; --accent-soft:#16344A;
  --trap:#F0A55A; --trap-soft:#3A2712; --ok:#5FD08A; --ok-soft:#133523; --bad:#FF8A7A; --bad-soft:#3D1814; --star:#F2C14E;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
header.top{display:grid;gap:6px;margin-bottom:14px}
header.top h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;letter-spacing:.01em}
header.top p{margin:0;color:var(--muted);max-width:65ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;font:500 13px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:4px}
button:focus-visible,select:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:14px var(--f-body);background:var(--surface);color:var(--ink)}
.lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{padding-top:18px}
.cards{display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.card-h{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--sunk);border-bottom:1px solid var(--line)}
.lec{font:500 12px var(--f-mono);background:var(--ink);color:var(--bg);padding:2px 8px;border-radius:4px;white-space:nowrap}
.card-h h2{font-size:1.08rem;font-weight:600;flex:1;min-width:0}
.star{border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:var(--line);padding:4px}
.star[aria-pressed="true"]{color:var(--star)}
.card-b{padding:14px;display:grid;gap:12px}
.rule{margin:0;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;font-weight:500}
.rule b{font-family:var(--f-display)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
thead th{background:var(--sunk);font:600 13px var(--f-body)}
tbody tr:last-child td{border-bottom:0}
td:first-child{font-weight:600;white-space:nowrap}
.traps{margin:0;padding:10px 12px 10px 30px;background:var(--trap-soft);border-radius:6px;display:grid;gap:4px}
.traps li::marker{color:var(--trap)}
.traps-h{font:600 12px var(--f-mono);color:var(--trap);letter-spacing:.06em;text-transform:uppercase;margin-bottom:-6px}
.card-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:0 14px 14px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:8px 14px;font:600 14px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
code,.mono{font-family:var(--f-mono);font-size:.92em}
.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
/* quiz */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:14px;max-width:760px}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.score{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.qtext{font-size:1.08rem;font-weight:500;margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:15px var(--f-body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:8px;padding:12px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb p{margin:0}
.fb .tag{font:600 12px var(--f-mono);letter-spacing:.06em}
.fb.ok .tag{color:var(--ok)} .fb.bad .tag{color:var(--bad)}
.mix{border-top:1px solid var(--line);padding-top:6px}
.mrow{display:grid;grid-template-columns:1fr minmax(0,220px);gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow p{margin:0;min-width:0}
.mrow select{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:14px var(--f-body)}
.mrow.ok select{border-color:var(--ok);background:var(--ok-soft)} .mrow.bad select{border-color:var(--bad);background:var(--bad-soft)}
.mrow .ans{grid-column:1/-1;font-size:13px;color:var(--bad)}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.card,.qbox{animation:in .25s ease-out both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script>
const CH = {1:"L1–2 Intro/Architecture",2:"L3–4 Application",5:"L5 Data Link/Error/Flow",6:"L6 MAC/Ethernet",7:"L7 ARP/Switch/VLAN"};

const G = [
/* ---------------- Chapter 1 ---------------- */
{id:"delay",ch:1,lec:"L1",title:"ความหน่วง 4 แบบ: Processing / Queueing / Transmission / Propagation",
 t:["Processing delay","Queueing delay","Transmission delay","Propagation delay"],

 rows:[["Processing delay","ตรวจ bit error, อ่าน header, เลือก output link (มัก < µs)","ในเราเตอร์ทันทีที่ packet มาถึง"],
       ["Queueing delay","ความแออัด วัดด้วย traffic intensity La/R","รอคิวในบัฟเฟอร์ของ output link"],
       ["Transmission delay","d_trans = L/R (ขนาด packet ÷ อัตราลิงก์)","ดันบิตทั้งหมดของ packet ลงสาย"],
       ["Propagation delay","d_prop = d/s (ระยะทาง ÷ ความเร็วสัญญาณ ≈ 2×10⁸ m/s)","บิตวิ่งจากปลายสายหนึ่งไปอีกปลาย"]],
 rule:"<b>Transmission</b> ขึ้นกับขนาดข้อมูลและ bandwidth ไม่เกี่ยวกับระยะทาง ส่วน <b>Propagation</b> ขึ้นกับระยะทาง ไม่เกี่ยวกับขนาด packet",
 traps:["Caravan analogy: เวลาที่ด่านเก็บเงินปล่อยรถครบทั้งขบวน = transmission ส่วนเวลาขับระหว่างด่าน = propagation","La/R → 0 คิวสั้น, La/R → 1 คิวยาวมาก, La/R > 1 ค่าเฉลี่ย delay เป็นอนันต์","d_nodal = d_proc + d_queue + d_trans + d_prop"],
 qs:[{q:"ส่ง packet 4,000 bits บนลิงก์ 2 Mbps ใช้เวลา 2 ms ในการปล่อยบิตทั้งหมดลงสาย เวลานี้คือ",a:"Transmission delay",x:"L/R = 4,000 / 2×10⁶ = 2 ms ขึ้นกับขนาด packet และ bandwidth ไม่ใช้ระยะทางเลย"},
     {q:"สายยาว 2,000 km สัญญาณวิ่ง 2×10⁸ m/s ใช้เวลา 10 ms ให้บิตแรกไปถึงปลายทาง",a:"Propagation delay",x:"d/s = 2×10⁶ m / 2×10⁸ m/s = 10 ms ขึ้นกับระยะทาง ไม่เกี่ยวกับขนาด packet"},
     {q:"เมื่อ traffic intensity La/R เข้าใกล้ 1 ความหน่วงชนิดใดพุ่งสูง",a:"Queueing delay",x:"La/R คืออัตราบิตที่เข้ามาเทียบกับอัตราที่ลิงก์ส่งออกได้ ถ้าใกล้ 1 คิวจะยาวขึ้นมาก"},
     {q:"เวลาที่เราเตอร์ใช้ตรวจ bit error และตัดสินใจว่าจะส่งออก link ไหน",a:"Processing delay",x:"Processing = อ่าน header, ตรวจ error, เลือก output link ปกติเล็กมากระดับ µs"}]},

{id:"switching",ch:1,lec:"L1",title:"Circuit switching vs Packet switching และ FDM vs TDM",
 t:["Circuit switching","Packet switching","FDM","TDM"],
 cols:["ประเด็น","Circuit switching","Packet switching"],
 rows:[["ทรัพยากร","จองไว้ตลอดการเชื่อมต่อ (dedicated)","แชร์ใช้ตามต้องการ (on-demand)"],
       ["ต้อง setup","ต้องมี call setup","ไม่ต้อง ส่งได้เลย"],
       ["ประสิทธิภาพ","รับประกันได้ แต่ถ้าไม่ส่งก็เสียเปล่า","คุ้ม แต่มี queueing delay และ loss ตอนแออัด"],
       ["เหมาะกับ","โทรศัพท์แบบดั้งเดิม","ข้อมูลแบบ bursty"],
       ["ตัวอย่างในสไลด์ (1 Gbps, user ละ 100 Mbps, active 10%)","รองรับได้ 10 คน","35 คน โอกาสที่ >10 คน active พร้อมกัน < 0.0004"]],
 rule:"<b>Circuit</b> = จองก่อนแล้วใช้คนเดียว ส่วน <b>Packet</b> = แชร์กัน ใครมีข้อมูลก็ส่ง แต่ต้องต่อคิว (store-and-forward)",
 traps:["FDM แบ่งความถี่: แต่ละ call ได้ band แคบของตัวเอง ใช้ได้ตลอดเวลา","TDM แบ่งเวลา: แต่ละ call ได้ทั้ง band แต่ส่งได้เฉพาะ slot ของตัวเอง","FDM และ TDM เป็นวิธีทำ circuit switching ไม่ใช่ packet switching","Store-and-forward: ต้องรับ packet ครบทั้งก้อนก่อนจึงส่งต่อไป link ถัดไป"],
 qs:[{q:"ทรัพยากรบนเส้นทางถูกจองไว้ให้การเชื่อมต่อตลอด แม้ช่วงที่ไม่มีข้อมูลจะส่ง",a:"Circuit switching",x:"การจองแบบ dedicated คือลักษณะของ circuit switching ข้อเสียคือช่วงว่างก็ใช้ไม่ได้"},
     {q:"เราเตอร์ต้องรับ packet ครบทั้งก้อนก่อนจึงส่งต่อไปยัง link ถัดไป",a:"Packet switching",x:"Store-and-forward เป็นกลไกของ packet switching"},
     {q:"Cable TV (HFC) ส่งทั้ง data และช่อง TV บนสายเดียวกันโดยใช้คนละความถี่",a:"FDM",x:"แบ่งตามความถี่ = Frequency Division Multiplexing"},
     {q:"แต่ละ call ได้ใช้ bandwidth ทั้งหมด แต่เฉพาะช่วง time slot ของตัวเองเป็นรอบ ๆ",a:"TDM",x:"แบ่งตามเวลา = Time Division Multiplexing"}]},

{id:"fwdroute",ch:1,lec:"L1",title:"Forwarding vs Routing",

 cols:["ประเด็น","Forwarding","Routing"],
 rows:[["ขอบเขต","local action ในเราเตอร์ตัวเดียว","global action ทั้งเครือข่าย"],
       ["ทำอะไร","ย้าย packet จาก input link ไป output link ตาม forwarding table","คำนวณเส้นทางจากต้นทางถึงปลายทางด้วย routing algorithm"],
       ["ชื่ออื่น","switching","-"],
       ["เปรียบเทียบ","เลือกเลี้ยวที่ทางแยกหนึ่งแห่ง","วางแผนเส้นทางทั้งทริป"]],
 rule:"<b>Forwarding</b> ดูตารางแล้วส่งออกพอร์ต (ในเครื่องเดียว) ส่วน <b>Routing</b> คือการสร้างตารางนั้นจากภาพรวมเครือข่าย",
 traps:["forwarding table ถูกสร้างจากผลของ routing algorithm","header ที่ใช้ตัดสินคือ destination address ของ packet"],
 qs:[{q:"เราเตอร์อ่าน destination address แล้วส่ง packet ออก output link ตาม local table",a:"Forwarding",x:"เป็น local action ของเราเตอร์ตัวเดียว เรียกอีกชื่อว่า switching"},
     {q:"การหาเส้นทางที่ packet จะใช้ตั้งแต่ต้นทางจนถึงปลายทาง",a:"Routing",x:"เป็น global action ใช้ routing algorithm สร้าง forwarding table"}]},

{id:"encap",ch:1,lec:"L1",title:"Message / Segment / Datagram / Frame และ layer ต่าง ๆ",

 rows:[["Message","Application","M","HTTP, SMTP, IMAP, DNS"],
       ["Segment","Transport","[Ht | M]","TCP, UDP ส่งระหว่าง process"],
       ["Datagram","Network","[Hn | Ht | M]","IP, routing ส่งจาก host ถึง host ผ่านหลาย hop"],

     {q:"หน่วยข้อมูลที่ส่งข้ามลิงก์เดียวระหว่างโหนดที่อยู่ติดกัน",a:"Frame",x:"Link layer ส่ง frame แบบ hop-by-hop"},
     {q:"ชั้นใดใน OSI ที่ทำ encryption และ compression แต่ไม่มีใน TCP/IP stack",a:"Presentation",o:["Presentation","Session","Transport","Application"],x:"Presentation = ตีความข้อมูล (encryption, compression) ส่วน Session = synchronization, checkpoint, recovery"}]},

{id:"scale",ch:1,lec:"L1–2",title:"PAN / LAN / MAN / WAN และ Dedicated vs Shared access",

     {q:"เหตุใด loop ใน layer 2 จึงอันตราย",a:"Ethernet frame ไม่มี TTL จึงวนและเพิ่มจำนวนไม่รู้จบ",o:["Ethernet frame ไม่มี TTL จึงวนและเพิ่มจำนวนไม่รู้จบ","ทำให้ CRC ผิด","ทำให้ IP address ซ้ำ","ทำให้ ARP ใช้ไม่ได้"],x:"broadcast storm: switch ทำสำเนาใหม่ทุกรอบ"},

];

/* ---------- state ---------- */
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let S = {mode:"read", ch:"all", q:"", stars:new Set(store.get("nm-stars",[]))};
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function filtered(){
  const q=S.q.trim().toLowerCase();
  return G.filter(g=>{
    if(S.ch==="star"&&!S.stars.has(g.id))return false;
    if(S.ch!=="all"&&S.ch!=="star"&&String(g.ch)!==S.ch)return false;
    if(!q)return true;
    return JSON.stringify(g).toLowerCase().includes(q);
  });
}

/* ---------- chips ---------- */
function renderChips(){
  const count=c=>G.filter(g=>String(g.ch)===c).length;
  const items=[["all","ทุกบท",G.length]].concat(Object.keys(CH).map(k=>[k,CH[k],count(k)])).concat([["star","★ ที่ติดดาว",S.stars.size]]);
  $("#chips").innerHTML=items.map(([k,l,n])=>`<button class="chip" data-ch="${k}" aria-pressed="${S.ch===k}">${esc(l)}<span class="n">${n}</span></button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{S.ch=b.dataset.ch;renderChips();render()});
}

/* ---------- read mode ---------- */
function cardHTML(g){
  const head=`<tr>${g.cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`;
  const body=g.rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
  return `<article class="card" id="g-${g.id}">
    <div class="card-h"><span class="lec">${esc(g.lec)}</span><h2>${esc(g.title)}</h2>
      <button class="star" data-star="${g.id}" aria-pressed="${S.stars.has(g.id)}" aria-label="ติดดาวกลุ่มนี้" title="ติดดาว = ยังจำไม่ได้">★</button></div>
    <div class="card-b">
      <p class="rule">${g.rule}</p>
      <div class="tbl"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
      <div class="traps-h">กับดักในข้อสอบ</div>
      <ul class="traps">${g.traps.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    </div>
    <div class="card-f"><span class="lbl">${g.qs.length} โจทย์</span><button class="btn ghost" data-drill="${g.id}">ฝึกเฉพาะกลุ่มนี้</button></div>
  </article>`;
}
function renderRead(){
  const list=filtered();
  if(!list.length){$("#view").innerHTML=`<div class="empty">${S.ch==="star"?"ยังไม่มีกลุ่มที่ติดดาว กด ★ ที่มุมการ์ดกลุ่มที่ยังจำไม่ได้":"ไม่พบคำที่ค้นหา"}</div>`;return}
  $("#view").innerHTML=`<div class="cards">${list.map(cardHTML).join("")}</div>`;
  bindStars();
  $("#view").querySelectorAll("[data-drill]").forEach(b=>b.onclick=()=>startQuiz([G.find(g=>g.id===b.dataset.drill)]));
}
function bindStars(){
  $("#view").querySelectorAll("[data-star]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.star; S.stars.has(id)?S.stars.delete(id):S.stars.add(id);
    b.setAttribute("aria-pressed",S.stars.has(id)); store.set("nm-stars",[...S.stars]); renderChips();
  });
}

/* ---------- quiz mode ---------- */
let Q=null;
function describe(g,term){
  const r=g.rows.find(r=>r[0]===term);
  if(r)return g.cols.slice(1).map((c,i)=>`${c}: ${r[i+1]}`).join(" · ");
  const j=g.cols.indexOf(term);
  if(j>0)return g.rows.slice(0,3).map(r=>`${r[0]}: ${r[j]}`).join(" · ");
  return null;
}
function makeItems(groups){
  const items=[];
  groups.forEach(g=>g.qs.forEach(q=>{
    let opts=q.o?q.o.slice():[q.a].concat(shuffle(g.t.filter(t=>t!==q.a)).slice(0,3));
    items.push({g,q,opts:shuffle(opts)});
  }));
  return shuffle(items);
}
function startQuiz(groups){
  S.mode="quiz"; setModeBtns();
  groups=groups||filtered();
  Q={items:makeItems(groups),i:0,right:0,done:0,wrongGroups:new Set(),scope:groups.length===1?groups[0].title:null};
  renderQuiz();
}
function renderQuiz(){
  if(!Q||!Q.items.length){$("#view").innerHTML=`<div class="empty">ไม่มีโจทย์ในตัวกรองนี้ ลองเลือก “ทุกบท”</div>`;return}
  if(Q.i>=Q.items.length){
    const wg=[...Q.wrongGroups].map(id=>G.find(g=>g.id===id));
    $("#view").innerHTML=`<div class="qbox"><span class="lbl">จบชุด</span>
      <h2>ได้ ${Q.right} / ${Q.items.length}</h2>
      ${wg.length?`<p>กลุ่มที่ยังพลาด (ติดดาวให้อัตโนมัติแล้ว):</p><ul>${wg.map(g=>`<li>${esc(g.title)}</li>`).join("")}</ul>`:"<p>ไม่พลาดเลยในชุดนี้</p>"}
      <div class="row"><button class="btn" id="again">เริ่มชุดใหม่</button>${wg.length?`<button class="btn ghost" id="redo">ฝึกเฉพาะกลุ่มที่พลาด</button>`:""}</div></div>`;
    $("#again").onclick=()=>startQuiz();
    if(wg.length)$("#redo").onclick=()=>startQuiz(wg);
    return;
  }
  const it=Q.items[Q.i];
  $("#view").innerHTML=`<div class="qbox">
    <div class="qmeta"><span class="lbl">${esc(it.g.lec)} · ${esc(Q.scope||"สุ่มจากตัวกรองปัจจุบัน")}</span><span class="score">ข้อ ${Q.i+1}/${Q.items.length} · ถูก ${Q.right}</span></div>
    <p class="qtext">${esc(it.q.q)}</p>
    <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join("")}</div>
    <div id="fb"></div></div>`;
  $("#view").querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(it,it.opts[+b.dataset.k]));
}
function answer(it,pick){
  const ok=pick===it.q.a;
  Q.done++; if(ok)Q.right++; else{Q.wrongGroups.add(it.g.id);S.stars.add(it.g.id);store.set("nm-stars",[...S.stars]);renderChips()}
  $("#view").querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=it.opts[+b.dataset.k];if(v===it.q.a)b.classList.add("ok");else if(v===pick)b.classList.add("bad")});
  let mix="";
  if(!ok){
    const d=describe(it.g,pick);
    mix=`<p class="mix"><b>คุณสับสนกับ ${esc(pick)}</b>${d?` ซึ่ง ${esc(d)}`:""}</p><p><b>วิธีแยก:</b> ${it.g.rule}</p>`;
  }
  $("#fb").innerHTML=`<div class="fb ${ok?"ok":"bad"}"><span class="tag">${ok?"ถูกต้อง":"ยังไม่ใช่ · คำตอบคือ "+esc(it.q.a)}</span><p>${esc(it.q.x)}</p>${mix}
    <div class="row"><button class="btn" id="next">${Q.i+1<Q.items.length?"ข้อถัดไป":"ดูสรุป"}</button><button class="btn ghost" id="see">เปิดการ์ดสรุป</button></div></div>`;
  $("#next").onclick=()=>{Q.i++;renderQuiz()};
  $("#next").focus();
  $("#see").onclick=()=>{S.mode="read";S.ch=String(it.g.ch);S.q="";$("#q").value="";setModeBtns();renderChips();render();const el=document.getElementById("g-"+it.g.id);if(el)el.scrollIntoView({block:"start"})};
}

/* ---------- match mode ---------- */
let M=null;
function startMatch(){
  const pool=[];
  filtered().forEach(g=>g.qs.forEach(q=>{if(!q.o)pool.push({g,q})}));
  const pick=[],seen=new Set();
  for(const it of shuffle(pool)){if(seen.has(it.q.a))continue;seen.add(it.q.a);pick.push(it);if(pick.length===5)break}
  M={items:pick,answers:shuffle(pick.map(p=>p.q.a)),checked:false};
  renderMatch();
}
function renderMatch(){
  if(!M||M.items.length<3){$("#view").innerHTML=`<div class="empty">ตัวกรองนี้มีคำไม่พอสำหรับจับคู่ ลองเลือกบทอื่นหรือ “ทุกบท”</div>`;return}
  $("#view").innerHTML=`<div class="qbox"><div class="qmeta"><span class="lbl">จับคู่ข้อความกับคำ (แต่ละคำใช้ได้ครั้งเดียว)</span></div>
    <div>${M.items.map((it,i)=>`<div class="mrow" id="mr${i}"><p>${esc(it.q.q)}</p>
      <select id="ms${i}" aria-label="คำตอบข้อ ${i+1}"><option value="">เลือกคำ</option>${M.answers.map(a=>`<option>${esc(a)}</option>`).join("")}</select></div>`).join("")}</div>
    <div class="row"><button class="btn" id="mcheck">ตรวจคำตอบ</button><button class="btn ghost" id="mnew">สุ่มชุดใหม่</button></div></div>`;
  $("#mnew").onclick=startMatch;
  $("#mcheck").onclick=()=>{
    let r=0;
    M.items.forEach((it,i)=>{
      const row=$("#mr"+i),v=$("#ms"+i).value,ok=v===it.q.a;
      row.classList.remove("ok","bad");row.classList.add(ok?"ok":"bad");
      const old=row.querySelector(".ans");if(old)old.remove();
      if(ok)r++;else{
        S.stars.add(it.g.id);
        row.insertAdjacentHTML("beforeend",`<div class="ans">คำตอบคือ <b>${esc(it.q.a)}</b>${v?` (คุณเลือก ${esc(v)})`:""} · ${esc(it.q.x)}</div>`);
      }
    });
    store.set("nm-stars",[...S.stars]);renderChips();
    $("#mcheck").textContent=`ถูก ${r}/${M.items.length} · ตรวจอีกครั้ง`;
  };
}

/* ---------- mode switching ---------- */
function setModeBtns(){["read","quiz","match"].forEach(m=>$("#m-"+m).setAttribute("aria-pressed",S.mode===m))}
function render(){
  if(S.mode==="read")renderRead();
  else if(S.mode==="quiz")startQuiz();
  else startMatch();
}
$("#m-read").onclick=()=>{S.mode="read";setModeBtns();render()};
$("#m-quiz").onclick=()=>{S.mode="quiz";setModeBtns();render()};
$("#m-match").onclick=()=>{S.mode="match";setModeBtns();render()};
let tmr;$("#q").oninput=e=>{clearTimeout(tmr);tmr=setTimeout(()=>{S.q=e.target.value;render()},150)};

renderChips();render();
</script>
